<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            color: #333;
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #eee;
        }

        .header h1 {
            color: #2c3e50;
            margin: 0;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .stat-card {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-label {
            font-size: 14px;
            color: #7f8c8d;
        }

        .profit.positive {
            color: #27ae60;
        }

        .profit.negative {
            color: #e74c3c;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 12px;
            color: #95a5a6;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>Titan System Report</h1>
            <p>{{ date }}</p>
        </div>

        <div class="stat-grid">
            <div class="stat-card">
                <div class="stat-label">Daily Profit</div>
                <div class="stat-value profit {{ 'positive' if total_profit >= 0 else 'negative' }}">
                    ${{ "%.2f"|format(total_profit) }}
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Total Trades</div>
                <div class="stat-value">{{ trades_count }}</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Win Rate</div>
                <div class="stat-value">{{ "%.1f"|format(win_rate) }}%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Account Equity</div>
                <div class="stat-value highlight">${{ "%.2f"|format(equity) }}</div>
            </div>
        </div>

        <div class="footer">
            Generated by Titan Trading System 2.0
        </div>
    </div>
</body>

</html>
